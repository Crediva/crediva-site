<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<title>Thank You — CREDIVA</title>
<style>
:root {
  --bg-base: #fafbff;
  --text-primary: #0a0e1a;
  --accent: #1e5a8f;
  --gradient-primary: linear-gradient(135deg, #1e5a8f 0%, #4a8cc7 100%);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Geist",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg-base);color:var(--text-primary);line-height:1.6;display:flex;align-items:center;justify-content:center;min-height:100vh}
.container{max-width:600px;margin:0 auto;padding:60px 32px;text-align:center}
h1{font-size:42px;font-weight:700;letter-spacing:-0.02em;margin-bottom:16px}
p{font-size:18px;color:#5a6478;margin-bottom:32px}
.checkmark{width:80px;height:80px;background:var(--gradient-primary);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 32px;font-size:40px;color:white}
.btn{display:inline-block;padding:14px 30px;background:var(--gradient-primary);color:white;border-radius:100px;font-weight:600;text-decoration:none}
</style>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
  <div class="checkmark">✓</div>
  <h1>Thank You!</h1>
  <p>We've received your message. Expect a reply within 24 hours.</p>
  <a href="/" class="btn">Back to Home</a>
</div>
</body>
</html>
